# Al publicar una release, avisa a la web (Comunicaa2/ExtMusic-web) para que se actualice sola.
# Necesita el secreto WEB_DISPATCH_TOKEN: token fine-grained solo para ExtMusic-web, con Contents: Read and write.
name: Avisar a la web

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

jobs:
  avisar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pedir a ExtMusic-web que se actualice
        env:
          GH_TOKEN: ${{ secrets.WEB_DISPATCH_TOKEN }}
        run: gh api repos/Comunicaa2/ExtMusic-web/dispatches -f event_type=nueva-version
